<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nueva Contrasena - Luz de Santiago - admin">
    <title>Nueva contrasena | Luz de Santiago</title>
</head>
<body>

    <!-- INICIO aside -->

    <aside>
        <a href="login.html">LUZ DE SANTIAGO</a>
        <img loading="lazy" src="../../routes/inicio/isotipo.png" width="100" height="50" alt="logo Luz de Santiago Estudio Fotografico">
        <p>Estudio Fotografico</p>

        <p>Panel de administracion &amp; Gestion</p>

        <small>© LUZ DE SANTIAGO ESTUDIO FOTOGRAFICO · TODOS LOS DERECHOS RESERVADOS</small>
    </aside>

    <!-- INICIO MAIN -->

    <main>

        <section class="nueva">

            <div>

                <p>Recuperar contraseña</p>
                <h1>Nueva contrasena</h1>
                <p>Ingresa tu nueva contraseña</p>

                <form action="login.html" method="post">

                    <label for="new-password">Nueva contraseña *</label>
                    <input type="password" id="new-password" name="new-password" minlength="8" placeholder="********" autocomplete="new-password" required>

                    <label for="confirm-password">Confirmar contraseña *</label>
                    <input type="password" id="confirm-password" name="confirm-password" minlength="8" placeholder="********" autocomplete="new-password" required>

                    <button type="button">Mostrar</button>

                    <button type="submit">Guardar contrasena</button>
                </form>


            </div>

        </section>

    </main>
    
</body>
</html>
