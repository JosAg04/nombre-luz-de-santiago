<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Codigo | Luz de Santiago</title>
</head>
<body>

    <!-- INICIO aside -->

    <aside>
        <a href="login.html">LUZ DE SANTIAGO</a>
        <img src="../../routes/inicio/isotipo.png" width="100" height="50" alt="logo Luz de Santiago Estudio Fotografico">
        <p>Estudio Fotografico</p>

        <h1>Panel de administracion &amp; Gestion</h1>

        <small>© LUZ DE SANTIAGO ESTUDIO FOTOGRAFICO · TODOS LOS DERECHOS RESERVADOS</small>

    </aside>

    <!-- INICIO MAIN -->

    <main>

        <section class="recuperar-codigo">

            <p>Recuperar contrasena</p>
            <h1>Ingresa el codigo</h1>
            <p>Ingresa el codigo que enviamos a tu correo</p>

            <form action="#" method="post">

                <fieldset>
                    <legend>Codigo de verificacion</legend>
                    <input type="text" name="digito1" inputmode="numeric" maxlength="1" required>
                    <input type="text" name="digito2" inputmode="numeric" maxlength="1" required>
                    <input type="text" name="digito3" inputmode="numeric" maxlength="1" required>
                    <input type="text" name="digito4" inputmode="numeric" maxlength="1" required>
                    <input type="text" name="digito5" inputmode="numeric" maxlength="1" required>
                    <input type="text" name="digito6" inputmode="numeric" maxlength="1" required>
                </fieldset>

                <button type="submit">Continuar</button>
            </form>

        </section>

    </main>
    
</body>
</html>
